<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>templatemapper</title>
    <style>
        html,
        body,
        body>div,
        #container,
        #container-uiarea {
            height: 100%;
        }
    </style>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/1.148.1/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m,sap.ui.core,sap.fe.templates"
        data-sap-ui-xx-bindingSyntax="complex" data-sap-ui-resource-roots='{
            "nav.tmp.map.templatemap": "./"
        }' data-sap-ui-on-init="module:sap/ui/core/ComponentSupport" data-sap-ui-compat-version="edge"
        data-sap-ui-async="true" data-sap-ui-frame-options="trusted"></script>
</head>

<body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component data-name="nav.tmp.map.templatemap" data-id="container"
        data-settings='{"id" : "nav.tmp.map.templatemap"}' data-handle-validation="true"></div>
</body>

</html>
